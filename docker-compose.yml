services:
  frontend:
    build:
      context: .
      target: runtime
    environment:
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-http://localhost:5000/api}
      HOST: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  proxy:
    build:
      context: ./proxy
    ports:
      - "${PROXY_PORT:-5000}:80"
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-backend}
      BACKEND_PORT: ${BACKEND_PORT:-8080}
      FRONTEND_HOST: frontend
      FRONTEND_PORT: "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - towatch-net
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

networks:
  towatch-net:
    name: towatch-net
    external: true
