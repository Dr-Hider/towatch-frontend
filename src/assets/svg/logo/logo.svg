<svg id="towatch-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" class="w-full h-auto max-h-[60vh] drop-shadow-2xl overflow-visible">
                <defs>
                    <!-- Gradient for WATCH text -->
                    <linearGradient id="watchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#00FF87"/>
                        <stop offset="100%" stop-color="#00B862"/>
                    </linearGradient>

                    <!-- Gradient accent line -->
                    <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#00FF87" stop-opacity="1"/>
                        <stop offset="70%" stop-color="#00FF87" stop-opacity="0.4"/>
                        <stop offset="100%" stop-color="#00FF87" stop-opacity="0"/>
                    </linearGradient>

                    <!-- Glow filter for internal elements if needed -->
                    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="8" result="blur"/>
                        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                    </filter>
                </defs>

                <!-- Optional Play Icon Badge integrated into "O" or side element -->
                <g transform="translate(15, 20)">
                    
                    <!-- Text Grouping -->
                    <text x="50" y="210" font-family="'Montserrat', sans-serif" font-size="160" font-weight="300" font-style="italic" letter-spacing="-3">
                        <!-- 'to' in White -->
                        <tspan class="logo-to" fill="#FFFFFF">to</tspan>
                        <!-- 'WATCH' in Vibrant Green -->
                        <tspan font-weight="900" font-style="normal" fill="url(#watchGradient)" dx="10" letter-spacing="2">WATCH</tspan>
                    </text>

                    <!-- Sleek Modern Play Symbol Accent inside/next to the logo -->
                    <g transform="translate(885, 95) scale(0.95)">
                        <circle cx="35" cy="35" r="35" fill="#00FF87" fill-opacity="0.15"/>
                        <circle cx="35" cy="35" r="28" fill="#00FF87" fill-opacity="0.2"/>
                        <polygon points="28,20 50,35 28,50" fill="#00FF87"/>
                    </g>

                    <!-- Futuristic Cinema Underline Beam -->
                    <rect x="55" y="240" width="880" height="6" rx="3" fill="url(#lineGradient)"/>
                    <!-- Dot accent -->
                    <circle cx="940" cy="243" r="3" fill="#00FF87"/>
                </g>
            </svg>